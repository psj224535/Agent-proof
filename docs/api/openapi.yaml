            }
          }
        },
        "parameters": [
          {
            "in": "header",
            "name": "Signature-Input",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "AgentProof strict RFC9421 Ed25519 profile. Use the provided crypto helpers; preserve the exact body bytes."
          },
          {
            "in": "header",
            "name": "Signature",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "AgentProof strict RFC9421 Ed25519 profile. Use the provided crypto helpers; preserve the exact body bytes."
          },
          {
            "in": "header",
            "name": "Content-Digest",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "AgentProof strict RFC9421 Ed25519 profile. Use the provided crypto helpers; preserve the exact body bytes."
          }
        ],
        "description": "Single-use authentication ticket plus runtime-key HTTP proof, exact original purchase body. No actual purchase/payment or authorization policy is evaluated."
      }
