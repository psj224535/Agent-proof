          },
          "503": {
            "description": "Source temporarily unavailable / server busy"
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/presentationSchema"
              }
            }
          }
        },
        "parameters": [
          {
            "in": "header",
            "name": "Signature-Input",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "AgentProof strict RFC9421 Ed25519 profile. Use the provided crypto helpers; preserve the exact body bytes."
          },
          {
            "in": "header",
            "name": "Signature",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "AgentProof strict RFC9421 Ed25519 profile. Use the provided crypto helpers; preserve the exact body bytes."
          },
          {
            "in": "header",
            "name": "Content-Digest",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "AgentProof strict RFC9421 Ed25519 profile. Use the provided crypto helpers; preserve the exact body bytes."
          }
        ]
      }
    },
    "/api/v1/protected/mock-purchase": {
      "post": {
