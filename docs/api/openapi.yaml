{
  "openapi": "3.1.0",
  "info": {
    "title": "AgentProof authentication and Sepolia trading API",
    "version": "0.2.0",
    "description": "Native local simulator plus separate real Sepolia testnet trading path. Primary Agent/verifier APIs. Runtime request schemas are reused; response schemas and auxiliary registry/issuer internal APIs are not fully described. Native JSON Schema validator, not Zod."
  },
  "paths": {
    "/api/v1/challenges": {
      "post": {
        "summary": "Issue request-bound passport challenge",
        "servers": [
          {
            "url": "http://127.0.0.1:3001"
          }
        ],
        "responses": {
          "200": {
            "description": "Success or authentication verdict. A 200 authentication response can contain REJECT/PARTIAL; inspect verdict."
          },
          "400": {
            "description": "Invalid schema, signature, target, or configuration conflict"
          },
          "401": {
            "description": "Administrator token missing or invalid"
          },
          "503": {
            "description": "Source temporarily unavailable / server busy"
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/challengeRequestSchema"
              }
            }
          }
        },
        "parameters": []
      }
    },
    "/api/v1/authenticate": {
      "post": {
        "summary": "Run the five sequential identity filters",
        "servers": [
          {
            "url": "http://127.0.0.1:3001"
          }
