              "schema": {
                "type": "object",
                "properties": {
                  "merchant": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048
                  },
                  "productId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048
                  },
                  "amount": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "purpose": {
                    "enum": [
                      "payment",
                      "browsing"
                    ]
                  },
                  "quantity": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100000
                  },
                  "expirationSeconds": {
                    "type": "integer",
