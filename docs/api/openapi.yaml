    "/api/presentations": {
      "post": {
        "summary": "Build, sign, submit and redeem a mock purchase",
        "servers": [
          {
            "url": "http://127.0.0.1:3000"
          }
        ],
        "responses": {
          "200": {
            "description": "Success or authentication verdict. A 200 authentication response can contain REJECT/PARTIAL; inspect verdict."
          },
          "400": {
            "description": "Invalid schema, signature, target, or configuration conflict"
          },
          "401": {
            "description": "Administrator token missing or invalid"
          },
          "503": {
            "description": "Source temporarily unavailable / server busy"
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "merchant": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048
                  },
                  "productId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048
                  },
                  "amount": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "purpose": {
                    "enum": [
                      "payment",
                      "browsing"
                    ]
                  },
                  "quantity": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100000
                  },
                  "expirationSeconds": {
                    "type": "integer",
                    "minimum": 10,
                    "maximum": 300
                  }
                },
                "required": [
                  "merchant",
                  "productId",
                  "amount",
                  "purpose",
                  "quantity",
                  "expirationSeconds"
                ],
                "additionalProperties": false
              }
            }
