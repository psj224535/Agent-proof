    "/api/trading/readiness": {
      "get": {
        "summary": "Read RPC-backed readiness and execution wallet address/balance",
        "servers": [
          {
            "url": "http://127.0.0.1:3100"
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "wallet",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^0x[0-9a-fA-F]{40}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Actual observed result; inspect verdict/status. No synthetic success."
          },
          "400": {
            "description": "Schema, policy, signature, state or chain validation failed. No purchase broadcast for preflight failure."
          },
          "500": {
            "description": "Safe internal error. If a transaction hash is present, reconcile rather than resubmit."
          },
          "503": {
            "description": "RPC/source unavailable"
          }
        },
        "security": []
      }
    },
